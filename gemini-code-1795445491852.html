<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapis HRC Coach (Dual BLE)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 15px; }
        h2 { text-align: center; color: #fff; margin-bottom: 10px; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        button { background: #007aff; color: white; border: none; padding: 12px 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin: 6px 0; width: 100%; }
        button:active { background: #0056b3; }
        .btn-green { background: #34c759; }
        .btn-red { background: #ff3b30; }
        .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; text-align: center; }
        .stat-box { background: #2c2c2e; padding: 12px; border-radius: 8px; }
        .stat-val { font-size: 28px; font-weight: bold; color: #0a84ff; }
        .hr-val { color: #ff3b30; }
        .hrc-badge { display: inline-block; background: #34c759; color: #000; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-top: 5px; }
        textarea { width: 100%; height: 75px; background: #2c2c2e; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 8px; font-family: monospace; box-sizing: border-box; font-size: 14px; }
        #log { background: #000; color: #0f0; font-family: monospace; padding: 10px; height: 110px; overflow-y: scroll; font-size: 11px; border-radius: 6px; }
    </style>
</head>
<body>

    <h2>Tapis HRC Coach</h2>

    <div class="card">
        <button id="btnConnectHr" onclick="connectHR()">1. Collega Fascia Cardio</button>
        <div id="statusHr" style="font-size: 13px; color: #aaa; margin-bottom: 10px;">Fascia: Disconnessa</div>
        
        <button id="btnConnectTreadmill" onclick="connectTreadmill()">2. Collega Tapis Roulant</button>
        <div id="statusTreadmill" style="font-size: 13px; color: #aaa;">Tapis: Disconnesso</div>
    </div>

    <div class="card">
        <div class="stats">
            <div class="stat-box">
                <div>Velocità Tapis</div>
                <div class="stat-val"><span id="lblSpeed">0.0</span> <span style="font-size:14px">km/h</span></div>
            </div>
            <div class="stat-box">
                <div>Battito Fascia</div>
                <div class="stat-val hr-val" id="lblHr">--</div>
                <div id="hrcBadgeContainer"></div>
            </div>
        </div>
    </div>

    <div class="card">
        <div style="font-size: 13px; color: #aaa; margin-bottom: 5px;">Programma (Minuti Velocità o Minuti HRC Min-Max):</div>
        <textarea id="txtProgram">5 3.5
20 HRC 130-145
5 3.0</textarea>
        <button class="btn-green" onclick="startWorkout()">Avvia Allenamento HRC</button>
        <button class="btn-red" onclick="stopWorkout()">Ferma</button>
        <div id="phaseStatus" style="margin-top: 10px; font-weight: bold; color: #ff9f0a;">Pronto</div>
    </div>

    <div class="card" style="margin-bottom: 20px;">
        <div style="font-size: 12px; color: #aaa; margin-bottom: 5px;">Log Diagnostica:</div>
        <div id="log">Pronto per la connessione...</div>
    </div>

<script>
    let hrDevice, hrServer;
    let treadmillDevice, treadmillServer, controlPointChar;
    let live = { speed: 0, hr: 0 };
    let workoutPhases = [], currentPhaseIdx = 0, phaseTimer = null, hrcInterval = null;
    let targetHrMin = 0, targetHrMax = 0, isHrcActive = false;
    let phaseEndTime = 0;
    let wakeLock = null;

    function log(msg) {
        const l = document.getElementById('log');
        l.innerHTML += "<br>" + msg;
        l.scrollTop = l.scrollHeight;
    }

    function requestWakeLockSafe() {
        try {
            if (typeof navigator !== 'undefined' && navigator.wakeLock && typeof navigator.wakeLock.request === 'function') {
                navigator.wakeLock.request('screen').then(function(wl) {
                    wakeLock = wl;
                    log("Schermo bloccato attivo.");
                }).catch(function(e) {
                    log("WakeLock ignorato: " + e.message);
                });
            }
        } catch (e) {}
    }

    function releaseWakeLockSafe() {
        try {
            if (wakeLock) {
                wakeLock.release().catch(function() {});
                wakeLock = null;
            }
        } catch (e) {}
    }

    async function connectHR() {
        try {
            log("Ricerca fascia cardio...");
            hrDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [0x180D]
            });
            log("Fascia trovata. Connessione GATT...");
            hrServer = await hrDevice.gatt.connect();
            const service = await hrServer.getPrimaryService(0x180D);
            const characteristic = await service.getCharacteristic(0x2A37);
            
            await characteristic.startNotifications();
            characteristic.addEventListener('characteristicvaluechanged', parseHR);
            
            document.getElementById('statusHr').innerText = "Fascia: Connessa e attiva!";
            log("Fascia cardio collegata con successo!");

            hrDevice.addEventListener('gattserverdisconnected', () => {
                document.getElementById('statusHr').innerText = "Fascia: Disconnessa";
                document.getElementById('lblHr').innerText = "--";
                log("Fascia disconnessa.");
            });
        } catch (err) {
            log("Errore fascia: " + err);
        }
    }

    function parseHR(e) {
        const val = e.target.value;
        const flags = val.getUint8(0);
        const is16Bit = flags & 0x01;
        live.hr = is16Bit ? val.getUint16(1, true) : val.getUint8(1);
        document.getElementById('lblHr').innerText = live.hr;
    }

    async function connectTreadmill() {
        try {
            log("Ricerca tapis roulant...");
            treadmillDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [0x1826]
            });
            log("Tapis trovato. Connessione GATT...");
            treadmillServer = await treadmillDevice.gatt.connect();
            const service = await treadmillServer.getPrimaryService(0x1826);
            
            controlPointChar = await service.getCharacteristic(0x2AD9);
            await controlPointChar.startNotifications();

            const notifyChar = await service.getCharacteristic(0x2ACD);
            await notifyChar.startNotifications();
            notifyChar.addEventListener('characteristicvaluechanged', (e) => {
                const d = e.target.value;
                let f = d.getUint16(0, true);
                if (!(f & 1) && d.byteLength >= 4) {
                    live.speed = d.getUint16(2, true) / 100;
                    document.getElementById('lblSpeed').innerText = live.speed.toFixed(1);
                }
            });
            
            document.getElementById('statusTreadmill').innerText = "Tapis: Connesso e pronto!";
            log("Tapis roulant collegato con successo!");
            
            await controlPointChar.writeValue(new Uint8Array([0x00]));

            treadmillDevice.addEventListener('gattserverdisconnected', () => {
                document.getElementById('statusTreadmill').innerText = "Tapis: Disconnesso";
                log("Tapis disconnesso.");
            });
        } catch (err) {
            log("Errore tapis: " + err);
        }
    }

    async function setSpeed(val) {
        if (!controlPointChar) return;
        try {
            let valKmh = Math.round(val * 100);
            let cmd = new Uint8Array([0x02, valKmh & 0xFF, (valKmh >> 8) & 0xFF]);
            await controlPointChar.writeValue(cmd);
            log("Imposta velocità tapis: " + val.toFixed(1) + " km/h");
        } catch (err) {
            log("Errore invio velocità: " + err);
        }
    }

    async function startWorkout() {
        if (!controlPointChar) {
            alert("Prima connetti il tapis roulant!");
            return;
        }
        if (!hrServer) {
            alert("Prima connetti la fascia cardio!");
            return;
        }
        
        requestWakeLockSafe();

        try {
            await controlPointChar.writeValue(new Uint8Array([0x07]));
            log("Comando START inviato al tapis.");
        } catch (err) {
            log("Errore start: " + err);
        }

        parseProgramText();
        if (workoutPhases.length === 0) {
            alert("Inserisci un programma valido!");
            return;
        }
        
        currentPhaseIdx = 0;
        runPhase();
    }

    function parseProgramText() {
        const lines = document.getElementById('txtProgram').value.split('\n');
        workoutPhases = [];
        for (let l of lines) {
            l = l.trim();
            if (!l) continue;
            let parts = l.split(' ');
            let duration = parseInt(parts[0]);
            if (parts[1] && parts[1].toUpperCase() === 'HRC') {
                let hrRange = parts[2].split('-');
                workoutPhases.push({ type: 'HRC', duration: duration * 60, min: parseInt(hrRange[0]), max: parseInt(hrRange[1]) });
            } else if (parts[1]) {
                workoutPhases.push({ type: 'SPEED', duration: duration * 60, speed: parseFloat(parts[1]) });
            }
        }
    }

    function runPhase() {
        if (currentPhaseIdx >= workoutPhases.length) {
            document.getElementById('phaseStatus').innerText = "Allenamento completato!";
            stopWorkout();
            return;
        }

        let phase = workoutPhases[currentPhaseIdx];
        phaseEndTime = Date.now() + (phase.duration * 1000);
        
        isHrcActive = (phase.type === 'HRC');
        if (isHrcActive) {
            targetHrMin = phase.min;
            targetHrMax = phase.max;
            document.getElementById('hrcBadgeContainer').innerHTML = `<span class="hrc-badge">HRC ${targetHrMin}-${targetHrMax} BPM</span>`;
            log(`Inizio fase HRC: Target ${targetHrMin}-${targetHrMax} BPM`);
            
            if (hrcInterval) clearInterval(hrcInterval);
            hrcInterval = setInterval(() => {
                if (live.hr > 0) {
                    if (live.hr > targetHrMax && live.speed > 1.0) {
                        let diff = live.hr - targetHrMax;
                        let step = diff >= 8 ? 0.5 : 0.2;
                        let newSpd = Math.max(1.0, Math.round((live.speed - step) * 10) / 10);
                        setSpeed(newSpd);
                        log(`HRC: Battito alto (${live.hr} BPM, +${diff}). Riduco di ${step} km/h.`);
                    } else if (live.hr < targetHrMin) {
                        let diff = targetHrMin - live.hr;
                        let step = diff >= 8 ? 0.5 : 0.2;
                        let newSpd = Math.round((live.speed + step) * 10) / 10;
                        setSpeed(newSpd);
                        log(`HRC: Battito basso (${live.hr} BPM, -${diff}). Aumento di ${step} km/h.`);
                    } else {
                        log(`HRC: Battito in range (${live.hr} BPM). Velocità invariata.`);
                    }
                } else {
                    log("HRC in attesa dei battiti dalla fascia...");
                }
            }, 10000);
        } else {
            document.getElementById('hrcBadgeContainer').innerHTML = "";
            if (hrcInterval) clearInterval(hrcInterval);
            setSpeed(phase.speed);
            log(`Inizio fase velocità fissa: ${phase.speed} km/h`);
        }

        if (phaseTimer) clearInterval(phaseTimer);
        phaseTimer = setInterval(() => {
            let timeLeft = Math.max(0, Math.ceil((phaseEndTime - Date.now()) / 1000));
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('phaseStatus').innerText = `Fase ${currentPhaseIdx+1}/${workoutPhases.length} (${phase.type}) - Rimasti: ${mins}:${secs < 10 ? '0':''}${secs}`;
            
            if (timeLeft <= 0) {
                clearInterval(phaseTimer);
                if (hrcInterval) clearInterval(hrcInterval);
                currentPhaseIdx++;
                runPhase();
            }
        }, 500);
    }

    async function stopWorkout() {
        if (phaseTimer) clearInterval(phaseTimer);
        if (hrcInterval) clearInterval(hrcInterval);
        isHrcActive = false;
        releaseWakeLockSafe();
        document.getElementById('hrcBadgeContainer').innerHTML = "";
        document.getElementById('phaseStatus').innerText = "Arrestato";
        if (controlPointChar) {
            try {
                await controlPointChar.writeValue(new Uint8Array([0x08]));
                log("Tapis fermato.");
            } catch (err) {
                log("Errore stop: " + err);
            }
        }
    }
</script>

</body>
</html>
