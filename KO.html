<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapis Coach Pro HRC</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 15px; }
        h2 { text-align: center; color: #fff; margin-bottom: 10px; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        button { background: #007aff; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin: 5px 0; width: 100%; }
        button:active { background: #0056b3; }
        .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; text-align: center; }
        .stat-box { background: #2c2c2e; padding: 10px; border-radius: 8px; }
        .stat-val { font-size: 24px; font-weight: bold; color: #0a84ff; }
        .hrc-badge { display: inline-block; background: #34c759; color: #000; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-top: 5px; }
        textarea { width: 100%; height: 80px; background: #2c2c2e; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 8px; font-family: monospace; }
        #log { background: #000; color: #0f0; font-family: monospace; padding: 10px; height: 100px; overflow-y: scroll; font-size: 12px; border-radius: 6px; }
    </style>
</head>
<body>

    <h2>Tapis Coach Pro HRC</h2>

    <div class="card">
        <button id="btnConnect" onclick="connectBT()">Connetti Tapis Roulant</button>
        <div id="status" style="margin-top: 8px; font-size: 14px; color: #aaa;">Stato: Non connesso</div>
    </div>

    <div class="card">
        <div class="stats">
            <div class="stat-box">
                <div>Velocità</div>
                <div class="stat-val"><span id="lblSpeed">0.0</span> <span style="font-size:14px">km/h</span></div>
            </div>
            <div class="stat-box">
                <div>Battito (BPM)</div>
                <div class="stat-val" id="lblHr">--</div>
                <div id="hrcBadgeContainer"></div>
            </div>
        </div>
    </div>

    <div class="card">
        <h3>Programma Allenamento</h3>
        <textarea id="txtProgram">5 3.5 0
20 HRC 130-145
5 3.0 0</textarea>
        <button style="background: #34c759;" onclick="startWorkout()">Avvia Allenamento</button>
        <button style="background: #ff3b30;" onclick="stopWorkout()">Ferma</button>
        <div id="phaseStatus" style="margin-top: 10px; font-weight: bold; color: #ff9f0a;">Pronto</div>
    </div>

    <div class="card">
        <h3>Log Diagnostica</h3>
        <div id="log">Pronto per la connessione...</div>
    </div>

<script>
    let bluetoothDevice, treadmillServer, controlPointChar;
    let live = { speed: 0, hr: 0, dist: 0 };
    let workoutPhases = [], currentPhaseIdx = 0, phaseTimer = null, hrcInterval = null;
    let targetHrMin = 0, targetHrMax = 0, isHrcActive = false;

    function log(msg) {
        const l = document.getElementById('log');
        l.innerHTML += "<br>" + msg;
        l.scrollTop = l.scrollHeight;
    }

    async function connectBT() {
        try {
            log("Ricerca tapis roulant FTMS...");
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ services: ['fitness_machine'] }]
            });
            
            treadmillServer = await bluetoothDevice.gatt.connect();
            log("Connesso al server GATT. Ottengo il servizio...");
            
            const service = await treadmillServer.getPrimaryService('fitness_machine');
            
            const notifyChar = await service.getCharacteristic('treadmill_data');
            await notifyChar.startNotifications();
            notifyChar.addEventListener('characteristicvaluechanged', parse);

            controlPointChar = await service.getCharacteristic('fitness_machine_control_point');
            await controlPointChar.startNotifications();
            
            document.getElementById('status').innerText = "Stato: Connesso con successo!";
            log("Tapis roulant pronto!");
            
            await controlPointChar.writeValue(new Uint8Array([0x00]));
        } catch(err) {
            log("Errore connessione: " + err);
        }
    }

    function parse(e) {
        const d = e.target.value;
        let f = d.getUint16(0, true);
        let o = 2; // Offset iniziale dopo i flag

        // Spostamento dinamico dell'offset in base ai campi presenti nel pacchetto FTMS
        if (!(f & 1)) { o += 2; } // Velocità
        if (f & 2) { o += 4; }    // Pendenza / Inclinazione
        if (f & 4) { o += 3; }    // Distanza

        // Lettura del battito cardiaco se il flag 256 è attivo o con fallback sul byte puntato
        if (f & 256) {
            let heartRate = d.getUint8(o);
            live.hr = heartRate;
        } else {
            if (d.byteLength > o) {
                let potentialHr = d.getUint8(o);
                if (potentialHr > 40 && potentialHr < 220) {
                    live.hr = potentialHr;
                }
            }
        }
        
        render();
    }

    function render() {
        document.getElementById('lblSpeed').innerText = live.speed.toFixed(1);
        document.getElementById('lblHr').innerText = live.hr > 0 ? live.hr : "--";
    }

    async function setSpeed(val) {
        if (!controlPointChar) return;
        try {
            let valKmh = Math.round(val * 100);
            let cmd = new Uint8Array([0x02, valKmh & 0xFF, (valKmh >> 8) & 0xFF]);
            await controlPointChar.writeValue(cmd);
            log("Imposta velocità: " + val + " km/h");
        } catch(err) {
            log("Errore invio velocità: " + err);
        }
    }

    async function startWorkout() {
        if (!controlPointChar) {
            alert("Prima connetti il tapis roulant!");
            return;
        }
        
        try {
            await controlPointChar.writeValue(new Uint8Array([0x07]));
            log("Comando START inviato.");
        } catch(err) {
            log("Errore comando start: " + err);
        }

        parseProgramText();
        if (workoutPhases.length === 0) {
            alert("Inserisci un programma valido!");
            return;
        }
        
        currentPhaseIdx = 0;
        runPhase();
    }

    function parseProgramText() {
        const lines = document.getElementById('txtProgram').value.split('\n');
        workoutPhases = [];
        for (let l of lines) {
            l = l.trim();
            if (!l) continue;
            let parts = l.split(' ');
            let duration = parseInt(parts[0]);
            if (parts[1].toUpperCase() === 'HRC') {
                let hrRange = parts[2].split('-');
                workoutPhases.push({ type: 'HRC', duration: duration * 60, min: parseInt(hrRange[0]), max: parseInt(hrRange[1]) });
            } else {
                workoutPhases.push({ type: 'SPEED', duration: duration * 60, speed: parseFloat(parts[1]), inc: parseFloat(parts[2] || 0) });
            }
        }
    }

    function runPhase() {
        if (currentPhaseIdx >= workoutPhases.length) {
            document.getElementById('phaseStatus').innerText = "Allenamento completato!";
            stopWorkout();
            return;
        }

        let phase = workoutPhases[currentPhaseIdx];
        let timeLeft = phase.duration;
        
        isHrcActive = (phase.type === 'HRC');
        if (isHrcActive) {
            targetHrMin = phase.min;
            targetHrMax = phase.max;
            document.getElementById('hrcBadgeContainer').innerHTML = `<span class="hrc-badge">HRC ${targetHrMin}-${targetHrMax} BPM</span>`;
            log(`Inizio fase HRC: Target ${targetHrMin}-${targetHrMax} BPM`);
            
            if (hrcInterval) clearInterval(hrcInterval);
            hrcInterval = setInterval(() => {
                if (live.hr > 0) {
                    if (live.hr > targetHrMax && live.speed > 1.0) {
                        let newSpd = Math.max(1.0, live.speed - 0.2);
                        setSpeed(newSpd);
                        log(`HRC: Battito alto (${live.hr} BPM). Riduco a ${newSpd.toFixed(1)} km/h`);
                    } else if (live.hr < targetHrMin) {
                        let newSpd = live.speed + 0.2;
                        setSpeed(newSpd);
                        log(`HRC: Battito basso (${live.hr} BPM). Aumento a ${newSpd.toFixed(1)} km/h`);
                    }
                } else {
                    log("HRC in attesa della frequenza cardiaca dal tapis...");
                }
            }, 10000);
        } else {
            document.getElementById('hrcBadgeContainer').innerHTML = "";
            if (hrcInterval) clearInterval(hrcInterval);
            setSpeed(phase.speed);
            log(`Inizio fase velocità fissa: ${phase.speed} km/h`);
        }

        if (phaseTimer) clearInterval(phaseTimer);
        phaseTimer = setInterval(() => {
            timeLeft--;
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('phaseStatus').innerText = `Fase ${currentPhaseIdx+1}/${workoutPhases.length} (${phase.type}) - Rimasti: ${mins}:${secs < 10 ? '0':''}${secs}`;
            
            if (timeLeft <= 0) {
                clearInterval(phaseTimer);
                if (hrcInterval) clearInterval(hrcInterval);
                currentPhaseIdx++;
                runPhase();
            }
        }, 1000);
    }

    async function stopWorkout() {
        if (phaseTimer) clearInterval(phaseTimer);
        if (hrcInterval) clearInterval(hrcInterval);
        isHrcActive = false;
        document.getElementById('hrcBadgeContainer').innerHTML = "";
        document.getElementById('phaseStatus').innerText = "Arrestato";
        if (controlPointChar) {
            try {
                await controlPointChar.writeValue(new Uint8Array([0x08]));
                log("Tapis fermato.");
            } catch(err) {
                log("Errore stop: " + err);
            }
        }
    }
</script>

</body>
</html>
